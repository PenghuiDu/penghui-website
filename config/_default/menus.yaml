# Navigation Links
#   To link a homepage section, specify the URL as a hash `#` followed by the
#     `id` of the desired block in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '#about'
    weight: 10
  - name: News
    url: '#news'
    weight: 20
  - name: Research
    url: '#research'
    weight: 30
  - name: Publications
    url: '#publications'
    weight: 40
  - name: Talks
    url: '#talks'
    weight: 50
  - name: Experience
    url: '#experience'
    weight: 60
  - name: Contact
    url: '#contact'
    weight: 70
  - name: Photos
    url: '#gallery'
    weight: 80

